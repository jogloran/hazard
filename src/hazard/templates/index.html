<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazard — Tile Pixel Art Editor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header id="app-header">
        <h1>Hazard</h1>
        <nav id="view-nav">
            <button id="btn-designer" class="view-btn active">Pattern Designer</button>
            <button id="btn-canvas" class="view-btn">Grid Canvas</button>
        </nav>
        <div id="header-actions">
            <button id="btn-save" title="Save to server">Save</button>
            <button id="btn-load" title="Load from server">Load</button>
            <button id="btn-export-json" title="Download project as JSON">Export JSON</button>
            <button id="btn-export-png" title="Export grid as PNG image">Export PNG</button>
            <input type="file" id="import-file" accept=".json" hidden>
            <button id="btn-import" title="Import project from JSON file">Import</button>
        </div>
    </header>

    <div id="app-body">
        <aside id="sidebar">
            <h2>Patterns</h2>
            <div id="pattern-list"></div>
            <div id="sidebar-actions">
                <button id="btn-new-pattern" title="Create a new blank pattern">+ New</button>
                <button id="btn-dup-pattern" title="Duplicate selected pattern">Duplicate</button>
                <button id="btn-del-pattern" title="Delete selected pattern">Delete</button>
            </div>
        </aside>

        <main id="main-area">
            <!-- Pattern Designer View -->
            <section id="designer-view" class="view">
                <div id="designer-toolbar">
                    <label id="pattern-name-label">
                        Name: <input id="pattern-name-input" type="text" placeholder="Pattern name">
                    </label>
                    <label>W: <input id="pattern-width-input" type="number" min="1" max="64" value="8"></label>
                    <label>H: <input id="pattern-height-input" type="number" min="1" max="64" value="8"></label>
                    <button id="btn-resize-pattern" title="Resize pattern">Resize</button>
                    <div id="tool-buttons">
                        <button class="tool-btn active" data-tool="pencil" title="Pencil (P)">&#9998; Pencil</button>
                        <button class="tool-btn" data-tool="eraser" title="Eraser (E)">&#9003; Eraser</button>
                        <button class="tool-btn" data-tool="fill" title="Fill (F)">&#9724; Fill</button>
                        <button class="tool-btn" data-tool="eyedropper" title="Eyedropper (I)">&#9738; Pick</button>
                    </div>
                    <div id="undo-redo">
                        <button id="btn-undo" title="Undo (Ctrl+Z)">Undo</button>
                        <button id="btn-redo" title="Redo (Ctrl+Y)">Redo</button>
                    </div>
                    <div id="preset-buttons">
                        <button id="btn-preset-solid" title="Fill with selected index">Solid</button>
                        <button id="btn-preset-checker" title="50% checkerboard">Checker</button>
                        <button id="btn-preset-checker25" title="25% checkerboard">Check 25%</button>
                        <button id="btn-preset-stripes" title="Vertical stripes">Stripes</button>
                        <button id="btn-preset-dot50" title="50% dot fill">Dot 50%</button>
                        <button id="btn-preset-dot25" title="25% dot fill">Dot 25%</button>
                    </div>
                    <div id="transform-buttons">
                        <button id="btn-flip-h" title="Flip horizontal">Flip H</button>
                        <button id="btn-flip-v" title="Flip vertical">Flip V</button>
                        <button id="btn-rotate-cw" title="Rotate 90° clockwise">Rot CW</button>
                        <button id="btn-rotate-ccw" title="Rotate 90° counter-clockwise">Rot CCW</button>
                    </div>
                    <label>Preview:
                        <select id="designer-palette-select" title="Preview palette (visualization only)"></select>
                    </label>
                </div>
                <div id="designer-workspace">
                    <div id="designer-canvas-container">
                        <canvas id="designer-canvas"></canvas>
                    </div>
                    <div id="color-picker">
                        <div id="current-color-wrapper">
                            <span id="selected-index-label">Index: 0</span>
                            <div id="current-color-display"></div>
                        </div>
                        <div id="color-swatches"></div>
                    </div>
                </div>
            </section>

            <!-- Grid Canvas View -->
            <section id="canvas-view" class="view" style="display:none;">
                <div id="grid-toolbar">
                    <label>Cols: <input type="number" id="grid-cols" min="1" max="100" value="20"></label>
                    <label>Rows: <input type="number" id="grid-rows" min="1" max="100" value="15"></label>
                    <button id="btn-apply-grid-size">Apply</button>
                    <button id="btn-clear-grid" title="Clear all tiles">Clear Grid</button>
                    <button id="btn-toggle-grid" title="Toggle grid lines (G)">Grid: On</button>
                    <div id="mode-buttons">
                        <button id="btn-mode-stamp" class="active" title="Stamp patterns (S)">Stamp</button>
                        <button id="btn-mode-select" title="Select tiles (S)">Select</button>
                    </div>
                    <span id="zoom-display">Zoom: 4x</span>
                </div>
                <div id="grid-workspace">
                    <div id="grid-canvas-container">
                        <canvas id="grid-canvas"></canvas>
                    </div>
                    <div id="palette-panel">
                        <h3>Palettes</h3>
                        <div id="palette-controls">
                            <label>Max indices: <input type="number" id="max-indices-input" min="1" max="256" value="4"></label>
                            <button id="btn-apply-max-indices">Apply</button>
                        </div>
                        <div id="palette-select-row">
                            <select id="grid-palette-select"></select>
                            <button id="btn-new-palette" title="Create new palette">+</button>
                            <button id="btn-del-palette" title="Delete selected palette">&times;</button>
                        </div>
                        <label>Name: <input type="text" id="palette-name-input" placeholder="Palette name"></label>
                        <div id="palette-color-editor"></div>

                        <div id="tile-info-panel" style="display:none;">
                            <h3>Selected Tile</h3>
                            <span id="tile-info-label"></span>
                            <label>Palette:
                                <select id="tile-palette-select"></select>
                            </label>
                            <span id="tile-transform-label"></span>
                            <div id="tile-transform-buttons">
                                <button id="tile-flip-h" title="Flip horizontal">Flip H</button>
                                <button id="tile-flip-v" title="Flip vertical">Flip V</button>
                                <button id="tile-rotate-cw" title="Rotate 90° CW">Rot CW</button>
                                <button id="tile-rotate-ccw" title="Rotate 90° CCW">Rot CCW</button>
                                <button id="tile-reset-transform" title="Reset transform">Reset</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <footer id="app-footer">
        <span id="save-status">Ready</span>
        <span id="cursor-info"></span>
    </footer>

    <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
